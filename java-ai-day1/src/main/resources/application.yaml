spring:
  ai:
    dashscope:
      api-key: sk-e3c4be5fdcfa4a3c8845d88be144cb95   # 替换成你的真实 key
      chat:
        options:
          model: qwen-max
      embedding:
        options:
          model: text-embedding-v3            # 阿里百炼的 Embedding 模型，用于向量化
      # ⚠️ 超时配置请勿在此处设置，connection-timeout / read-timeout / write-timeout

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磁盘空间分析器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .input-group button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .input-group button:hover {
            background: #5568d3;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            color: #333;
            font-size: 28px;
            font-weight: bold;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .directory-list, .file-list, .suggestion-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .directory-item, .file-item, .suggestion-item {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .directory-item:hover, .file-item:hover, .suggestion-item:hover {
            background: #f8f9fa;
        }

        .directory-header, .file-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .directory-name, .file-name {
            font-weight: 600;
            color: #333;
            word-break: break-all;
        }

        .directory-size, .file-size {
            color: #667eea;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 10px;
        }

        .directory-meta, .file-meta {
            font-size: 12px;
            color: #666;
        }

        .priority-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .priority-high {
            background: #fee;
            color: #c33;
        }

        .priority-medium {
            background: #ffa50020;
            color: #ff8c00;
        }

        .priority-low {
            background: #90ee9020;
            color: #228b22;
        }

        .suggestion-description {
            color: #666;
            margin: 8px 0;
            font-size: 14px;
        }

        .risk-warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            margin-top: 8px;
            font-size: 13px;
            color: #856404;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .cleanup-reason {
            color: #28a745;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 磁盘空间分析器</h1>
            <div class="input-group">
                <input type="text" id="pathInput" placeholder="输入要分析的目录路径（如：/tmp）" value="/tmp">
                <button onclick="analyzeDisk()">开始分析</button>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            正在分析磁盘使用情况...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="results" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>总大小</h3>
                    <div class="value" id="totalSize">-</div>
                </div>
                <div class="stat-card">
                    <h3>文件数量</h3>
                    <div class="value" id="fileCount">-</div>
                </div>
                <div class="stat-card">
                    <h3>子目录数</h3>
                    <div class="value" id="dirCount">-</div>
                </div>
                <div class="stat-card">
                    <h3>清理建议</h3>
                    <div class="value" id="suggestionCount">-</div>
                </div>
            </div>

            <div class="content-grid">
                <div class="section">
                    <h2>📁 子目录分析</h2>
                    <div id="directories" class="directory-list"></div>
                </div>

                <div class="section">
                    <h2>💡 清理建议</h2>
                    <div id="suggestions" class="suggestion-list"></div>
                </div>

                <div class="section" style="grid-column: 1 / -1;">
                    <h2>📄 大文件列表</h2>
                    <div id="largeFiles" class="file-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8087/api/disk';

        async function analyzeDisk() {
            const path = document.getElementById('pathInput').value.trim();
            
            if (!path) {
                showError('请输入目录路径');
                return;
            }

            showLoading(true);
            hideError();
            hideResults();

            try {
                const response = await fetch(`${API_BASE}/analyze?path=${encodeURIComponent(path)}`);
                
                if (!response.ok) {
                    if (response.status === 400) {
                        throw new Error('路径不安全或不存在，请检查路径是否在允许的范围内');
                    }
                    throw new Error('分析失败，请稍后重试');
                }

                const data = await response.json();
                displayResults(data);
                
            } catch (error) {
                showError(error.message);
            } finally {
                showLoading(false);
            }
        }

        function displayResults(data) {
            // 更新统计信息
            document.getElementById('totalSize').textContent = data.formattedTotalSize;
            document.getElementById('fileCount').textContent = data.fileCount;
            document.getElementById('dirCount').textContent = data.directoryCount;
            document.getElementById('suggestionCount').textContent = data.suggestions.length;

            // 显示子目录
            displayDirectories(data.subDirectories);

            // 显示大文件
            displayLargeFiles(data.largeFiles);

            // 显示清理建议
            displaySuggestions(data.suggestions);

            showResults();
        }

        function displayDirectories(directories) {
            const container = document.getElementById('directories');
            
            if (!directories || directories.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无子目录信息</div>';
                return;
            }

            container.innerHTML = directories.map(dir => `
                <div class="directory-item">
                    <div class="directory-header">
                        <div class="directory-name">📁 ${escapeHtml(dir.name)}</div>
                        <div class="directory-size">${dir.formattedSize}</div>
                    </div>
                    <div class="directory-meta">
                        路径: ${escapeHtml(dir.path)} | 文件数: ${dir.fileCount}
                    </div>
                    ${dir.canCleanup ? `<div class="cleanup-reason">✓ ${dir.cleanupReason}</div>` : ''}
                </div>
            `).join('');
        }

        function displayLargeFiles(files) {
            const container = document.getElementById('largeFiles');
            
            if (!files || files.length === 0) {
                container.innerHTML = '<div class="empty-state">未发现大文件</div>';
                return;
            }

            container.innerHTML = files.map(file => `
                <div class="file-item">
                    <div class="file-header">
                        <div class="file-name">📄 ${escapeHtml(file.name)}</div>
                        <div class="file-size">${file.formattedSize}</div>
                    </div>
                    <div class="file-meta">
                        路径: ${escapeHtml(file.path)} | 
                        类型: ${file.fileType || '未知'} | 
                        修改时间: ${formatDate(file.lastModified)}
                    </div>
                    ${file.canDelete ? `<div class="cleanup-reason">✓ ${file.deleteReason}</div>` : ''}
                </div>
            `).join('');
        }

        function displaySuggestions(suggestions) {
            const container = document.getElementById('suggestions');
            
            if (!suggestions || suggestions.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无清理建议</div>';
                return;
            }

            container.innerHTML = suggestions.map(suggestion => `
                <div class="suggestion-item">
                    <span class="priority-badge priority-${suggestion.priority.toLowerCase()}">
                        ${getPriorityText(suggestion.priority)}
                    </span>
                    <div class="suggestion-description">
                        <strong>${suggestion.description}</strong>
                    </div>
                    <div class="directory-meta">
                        可释放空间: ${suggestion.formattedReclaimableSpace} | 
                        类型: ${suggestion.type === 'FILE' ? '文件' : '目录'}
                    </div>
                    <div class="risk-warning">
                        ⚠️ ${suggestion.riskWarning}
                    </div>
                </div>
            `).join('');
        }

        function getPriorityText(priority) {
            const map = {
                'HIGH': '高优先级',
                'MEDIUM': '中优先级',
                'LOW': '低优先级'
            };
            return map[priority] || priority;
        }

        function formatDate(dateTimeArray) {
            if (!dateTimeArray) return '未知';
            // LocalDateTime 会被序列化为数组格式
            const date = new Date(dateTimeArray[0], dateTimeArray[1] - 1, dateTimeArray[2], 
                                  dateTimeArray[3], dateTimeArray[4], dateTimeArray[5]);
            return date.toLocaleString('zh-CN');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function showResults() {
            document.getElementById('results').style.display = 'block';
        }

        function hideResults() {
            document.getElementById('results').style.display = 'none';
        }

        // 页面加载时自动分析默认路径
        window.addEventListener('load', () => {
            analyzeDisk();
        });

        // 支持回车键触发分析
        document.getElementById('pathInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                analyzeDisk();
            }
        });
    </script>
</body>
</html>
